# ╔══════════════════════════════════════════════════════════════╗
# ║       MobMoney  —  config.yml                                ║
# ║  Compatible: Minecraft 1.8 – 1.21                           ║
# ║  Platforms:  Bukkit / Spigot / Paper / Purpur / Folia        ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Mobs that do not exist on the current server version are
# automatically skipped — no errors, no crashes.

settings:
  # Interface language: ru | en | uk
  language: en

  # Show reward in the Action Bar (above the hotbar)
  action-bar: true

  # Show full-screen Title when a boss-tier mob is killed
  title-on-boss: true

  # Give rewards for mobs that spawned from a spawner block?
  # false = anti-grinder protection
  spawner-mobs-reward: false

  # Log every reward to the server console
  log-kills: false

  # Multiply ALL rewards by this factor  (1.5 = +50%)
  global-multiplier: 1.0

  # Symbol appended to money amounts in messages
  currency-symbol: "$"

# ──────────────────────────────────────────────────────────────
#  Mob rewards.
#  Each entry needs:
#    min: <integer>   — minimum payout
#    max: <integer>   — maximum payout  (min == max → fixed)
#
#  EntityType names follow the MODERN (1.16+) naming convention.
#  The plugin automatically tries legacy aliases on older servers.
#    ZOMBIFIED_PIGLIN  →  PIG_ZOMBIE  on ≤1.15
#    MOOSHROOM         →  MUSHROOM_COW on some older builds
#    EVOKER            →  EVOCATION_ILLAGER on ≤1.11
# ──────────────────────────────────────────────────────────────
